<svg width="1000" height="625" viewBox="0 0 1000 625" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101d" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>
    <linearGradient id="tu-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="tu-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.18)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)" />
    </radialGradient>
  </defs>

  <rect width="1000" height="625" fill="url(#tu-bg)" />
  <rect width="1000" height="625" fill="url(#tu-glow)" />

  <!-- Grid lines -->
  <g stroke="rgba(59, 130, 246, 0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="1000" y2="90" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="270" x2="1000" y2="270" />
    <line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="0" y1="540" x2="1000" y2="540" />
    <line x1="250" y1="0" x2="250" y2="625" />
    <line x1="500" y1="0" x2="500" y2="625" />
    <line x1="750" y1="0" x2="750" y2="625" />
  </g>

  <!-- Website Header -->
  <g transform="translate(50, 30)">
    <rect width="900" height="60" rx="12" fill="rgba(19, 26, 46, 0.85)" stroke="rgba(59, 130, 246, 0.25)" />
    <rect x="25" y="18" width="24" height="24" rx="6" fill="#3b82f6" />
    <text x="60" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">ТЕХУЧЁТ 24</text>
    <text x="470" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Постановка на учёт · Снятие с учёта · Техосмотр Гостехнадзора · Восстановление ПСМ</text>
    <rect x="740" y="14" width="145" height="32" rx="8" fill="url(#tu-btn)" />
    <text x="812" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">+7 (495) 120-05-88</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(50, 120)">
    <rect width="280" height="28" rx="14" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.35)" />
    <circle cx="16" cy="14" r="4" fill="#60a5fa" />
    <text x="145" y="19" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">ГОСТЕХНАДЗОР МОСКВА И МО</text>
  </g>

  <text x="50" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Регистрация и сопровождение</text>
  <text x="50" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#60a5fa" letter-spacing="-0.5">спецтехники «под ключ» от 1 дня</text>
  <text x="50" y="280" font-family="system-ui, sans-serif" font-size="15" fill="#9ca3af">Тракторы, экскаваторы, погрузчики, самоходные машины и квадроциклы юр. и физ. лиц.</text>

  <!-- 4 Scenario Cards Grid -->
  <g transform="translate(50, 315)">
    <!-- Card 1 -->
    <rect width="210" height="270" rx="14" fill="rgba(19, 26, 46, 0.9)" stroke="rgba(59, 130, 246, 0.25)" />
    <circle cx="35" cy="35" r="15" fill="rgba(59, 130, 246, 0.2)" />
    <text x="35" y="41" font-family="monospace" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">01</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Постановка на учёт</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Получение номеров и СТС на новую и б/у технику. Подготовка полного пакета.</text>
    <rect x="25" y="215" width="160" height="34" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" />
    <text x="105" y="237" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">Срок: 1–2 дня →</text>
  </g>

  <g transform="translate(280, 315)">
    <!-- Card 2 -->
    <rect width="210" height="270" rx="14" fill="rgba(19, 26, 46, 0.9)" stroke="rgba(59, 130, 246, 0.25)" />
    <circle cx="35" cy="35" r="15" fill="rgba(59, 130, 246, 0.2)" />
    <text x="35" y="41" font-family="monospace" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">02</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Снятие с учёта</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Для продажи, лизинга, утилизации или вывоза за пределы РФ без очередей.</text>
    <rect x="25" y="215" width="160" height="34" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" />
    <text x="105" y="237" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">Без визита →</text>
  </g>

  <g transform="translate(510, 315)">
    <!-- Card 3 -->
    <rect width="210" height="270" rx="14" fill="rgba(19, 26, 46, 0.9)" stroke="rgba(59, 130, 246, 0.25)" />
    <circle cx="35" cy="35" r="15" fill="rgba(59, 130, 246, 0.2)" />
    <text x="35" y="41" font-family="monospace" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">03</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Техосмотр (ГТО)</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Официальный выезд инспектора, диагностическая карта и свидетельство.</text>
    <rect x="25" y="215" width="160" height="34" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" />
    <text x="105" y="237" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">Официально →</text>
  </g>

  <g transform="translate(740, 315)">
    <!-- Card 4 -->
    <rect width="210" height="270" rx="14" fill="rgba(19, 26, 46, 0.9)" stroke="rgba(59, 130, 246, 0.25)" />
    <circle cx="35" cy="35" r="15" fill="rgba(59, 130, 246, 0.2)" />
    <text x="35" y="41" font-family="monospace" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">04</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Восстановление ПСМ</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Дубликаты при утере, замена СТС, внесение изменений в конструкцию.</text>
    <rect x="25" y="215" width="160" height="34" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" />
    <text x="105" y="237" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">Юр. чистота →</text>
  </g>
</svg>

<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1118" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="tu-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#tu-bg)" />

  <!-- Grid overlay -->
  <g stroke="rgba(59, 130, 246, 0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Website Header Mock -->
  <rect x="40" y="30" width="720" height="50" rx="10" fill="rgba(23, 29, 45, 0.8)" stroke="rgba(59, 130, 246, 0.2)" />
  <rect x="60" y="44" width="22" height="22" rx="4" fill="#3b82f6" />
  <text x="90" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">ТЕХУЧЁТ 24</text>
  <text x="390" y="59" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Постановка на учёт · Снятие с учёта · Техосмотр · ПСМ</text>
  <rect x="630" y="42" width="115" height="26" rx="6" fill="#3b82f6" />
  <text x="687" y="59" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+7 (495) 120-...</text>

  <!-- Hero Content Mock -->
  <rect x="40" y="110" width="230" height="24" rx="12" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" />
  <text x="155" y="126" font-family="monospace, sans-serif" font-size="11" font-weight="bold" fill="#60a5fa" text-anchor="middle">ГОСТЕХНАДЗОР МОСКВА И МО</text>

  <text x="40" y="175" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Регистрация и сопровождение</text>
  <text x="40" y="210" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#60a5fa">спецтехники «под ключ» за 1–3 дня</text>
  <text x="40" y="245" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af">Тракторы, экскаваторы, погрузчики, квадроциклы, самоходные машины.</text>

  <!-- 4 Scenarios Grid -->
  <g transform="translate(40, 275)">
    <!-- Card 1 -->
    <rect width="170" height="180" rx="10" fill="rgba(23, 29, 45, 0.9)" stroke="rgba(59, 130, 246, 0.25)" />
    <circle cx="30" cy="30" r="12" fill="rgba(59, 130, 246, 0.2)" />
    <text x="30" y="35" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">01</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Постановка на учёт</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Получение номеров и СТС на новую и б/у спецтехнику</text>
    <rect x="20" y="138" width="130" height="24" rx="4" fill="rgba(59, 130, 246, 0.15)" />
    <text x="85" y="154" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#60a5fa" text-anchor="middle">Срок: от 1 дня →</text>
  </g>

  <g transform="translate(225, 275)">
    <!-- Card 2 -->
    <rect width="170" height="180" rx="10" fill="rgba(23, 29, 45, 0.9)" stroke="rgba(59, 130, 246, 0.25)" />
    <circle cx="30" cy="30" r="12" fill="rgba(59, 130, 246, 0.2)" />
    <text x="30" y="35" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">02</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Снятие с учёта</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Для продажи, утилизации или вывоза за пределы РФ</text>
    <rect x="20" y="138" width="130" height="24" rx="4" fill="rgba(59, 130, 246, 0.15)" />
    <text x="85" y="154" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#60a5fa" text-anchor="middle">Без очередей →</text>
  </g>

  <g transform="translate(410, 275)">
    <!-- Card 3 -->
    <rect width="170" height="180" rx="10" fill="rgba(23, 29, 45, 0.9)" stroke="rgba(59, 130, 246, 0.25)" />
    <circle cx="30" cy="30" r="12" fill="rgba(59, 130, 246, 0.2)" />
    <text x="30" y="35" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">03</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Техосмотр (ГТО)</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Официальный выезд инспектора с выдачей акта</text>
    <rect x="20" y="138" width="130" height="24" rx="4" fill="rgba(59, 130, 246, 0.15)" />
    <text x="85" y="154" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#60a5fa" text-anchor="middle">Официально →</text>
  </g>

  <g transform="translate(595, 275)">
    <!-- Card 4 -->
    <rect width="165" height="180" rx="10" fill="rgba(23, 29, 45, 0.9)" stroke="rgba(59, 130, 246, 0.25)" />
    <circle cx="30" cy="30" r="12" fill="rgba(59, 130, 246, 0.2)" />
    <text x="30" y="35" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">04</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Восстановление ПСМ</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Дубликаты при утере, замена СТС, внесение изменений</text>
    <rect x="20" y="138" width="125" height="24" rx="4" fill="rgba(59, 130, 246, 0.15)" />
    <text x="82" y="154" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#60a5fa" text-anchor="middle">Юр. чистота →</text>
  </g>
</svg>

<svg width="1000" height="625" viewBox="0 0 1000 625" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120c" />
      <stop offset="100%" stop-color="#050a06" />
    </linearGradient>
    <linearGradient id="zs-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="zs-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.18)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)" />
    </radialGradient>
  </defs>

  <rect width="1000" height="625" fill="url(#zs-bg)" />
  <rect width="1000" height="625" fill="url(#zs-glow)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(16, 185, 129, 0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="1000" y2="90" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="270" x2="1000" y2="270" />
    <line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="0" y1="540" x2="1000" y2="540" />
    <line x1="250" y1="0" x2="250" y2="625" />
    <line x1="500" y1="0" x2="500" y2="625" />
    <line x1="750" y1="0" x2="750" y2="625" />
  </g>

  <!-- Website Header -->
  <g transform="translate(50, 30)">
    <rect width="900" height="60" rx="12" fill="rgba(15, 26, 18, 0.85)" stroke="rgba(16, 185, 129, 0.25)" />
    <circle cx="35" cy="30" r="10" fill="#10b981" />
    <text x="58" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">ЗЕЛЁНЫЙ СРЕЗ</text>
    <text x="460" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Услуги арбористов · Вывоз порубочных остатков · Цены · Портфолио</text>
    <rect x="740" y="14" width="145" height="32" rx="8" fill="url(#zs-btn)" />
    <text x="812" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Оценить по фото</text>
  </g>

  <!-- Hero Content -->
  <!-- Eyebrow Pill -->
  <g transform="translate(50, 120)">
    <rect width="280" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" />
    <circle cx="16" cy="14" r="4" fill="#34d399" />
    <text x="145" y="19" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">МОСКВА И МОСКОВСКАЯ ОБЛАСТЬ</text>
  </g>

  <!-- Main Headline -->
  <text x="50" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Безопасный спил и санитарная</text>
  <text x="50" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#10b981" letter-spacing="-0.5">обрезка деревьев любой сложности</text>
  <text x="50" y="280" font-family="system-ui, sans-serif" font-size="15" fill="#9ca3af">Работаем методом промышленного альпинизма, с автовышек 22м и измельчителем веток.</text>

  <!-- Photo Upload Lead Widget Card -->
  <g transform="translate(50, 315)">
    <rect width="520" height="270" rx="16" fill="rgba(15, 26, 18, 0.92)" stroke="rgba(16, 185, 129, 0.35)" />
    
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Экспресс-расчёт сметы по фотографии</text>
    <text x="25" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af">Загрузите фото деревьев и участка — инженер назовёт фиксированную цену за 15 минут</text>

    <!-- Upload Box -->
    <rect x="25" y="80" width="470" height="110" rx="10" fill="rgba(7, 14, 9, 0.85)" stroke="rgba(16, 185, 129, 0.45)" stroke-dasharray="6 6" />
    <circle cx="260" cy="120" r="18" fill="rgba(16, 185, 129, 0.15)" />
    <text x="260" y="126" font-family="system-ui, sans-serif" font-size="18" fill="#34d399" text-anchor="middle">📷</text>
    <text x="260" y="152" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">Перетащите фотографии или выберите на телефоне</text>
    <text x="260" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Поддерживаются форматы JPG, PNG, HEIC до 25 МБ</text>

    <!-- Submit Button -->
    <rect x="25" y="205" width="470" height="46" rx="10" fill="url(#zs-btn)" />
    <text x="260" y="234" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Рассчитать стоимость и забронировать выезд →</text>
  </g>

  <!-- Right Visual Stack: Work Results & Stats -->
  <g transform="translate(600, 120)">
    <!-- Card 1: Before / After preview -->
    <rect width="350" height="225" rx="16" fill="rgba(15, 26, 18, 0.88)" stroke="rgba(16, 185, 129, 0.25)" />
    
    <rect x="20" y="20" width="150" height="120" rx="10" fill="#1f2937" />
    <rect x="20" y="20" width="150" height="120" rx="10" fill="rgba(0,0,0,0.3)" />
    <text x="95" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9ca3af" text-anchor="middle">ДО: Дуб 18м</text>
    
    <rect x="180" y="20" width="150" height="120" rx="10" fill="#064e3b" />
    <text x="255" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">ПОСЛЕ: Чисто</text>
    
    <text x="20" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Спил аварийного дуба в Истринском р-не</text>
    <text x="20" y="190" font-family="monospace, sans-serif" font-size="12" fill="#10b981">Срок: 4 часа · Без повреждения забора и проводов</text>
  </g>

  <g transform="translate(600, 365)">
    <!-- Card 2: System Features -->
    <rect width="350" height="220" rx="16" fill="rgba(15, 26, 18, 0.88)" stroke="rgba(16, 185, 129, 0.25)" />
    
    <rect x="20" y="20" width="310" height="55" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.2)" />
    <text x="35" y="44" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#34d399">26 посадочных страниц</text>
    <text x="35" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Кластеризация под каждый район и вид работ</text>

    <text x="20" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Telegram Lead Delivery</text>
    <text x="20" y="128" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Мгновенная доставка фото и геопозиции бригадиру</text>
    
    <rect x="20" y="150" width="180" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" />
    <text x="110" y="168" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">ЗВОНКИ + ЗАЯВКИ С ФОТО</text>
  </g>
</svg>

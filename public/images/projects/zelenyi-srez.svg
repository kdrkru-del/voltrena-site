<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b130e" />
      <stop offset="100%" stop-color="#070c09" />
    </linearGradient>
    <linearGradient id="zs-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#zs-bg)" />

  <!-- Grid overlay -->
  <g stroke="rgba(16, 185, 129, 0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Website Header Mock -->
  <rect x="40" y="30" width="720" height="50" rx="10" fill="rgba(18, 30, 22, 0.8)" stroke="rgba(16, 185, 129, 0.2)" />
  <circle cx="65" cy="55" r="8" fill="#10b981" />
  <text x="85" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">ЗЕЛЁНЫЙ СРЕЗ</text>
  <text x="400" y="59" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Услуги · Цены · Примеры работ · Калькулятор</text>
  <rect x="620" y="42" width="125" height="26" rx="6" fill="#10b981" />
  <text x="682" y="59" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Оценить по фото</text>

  <!-- Hero Content Mock -->
  <!-- Eyebrow -->
  <rect x="40" y="110" width="220" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" />
  <text x="150" y="126" font-family="monospace, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">МОСКВА И МОСКОВСКАЯ ОБЛАСТЬ</text>

  <!-- Main Headline -->
  <text x="40" y="175" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Профессиональный спил</text>
  <text x="40" y="210" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#10b981">и санитарная обрезка деревьев</text>
  <text x="40" y="245" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af">Выезд арбористов, собственный измельчитель веток и автовышки 22м.</text>

  <!-- Photo Upload Form Widget Card -->
  <rect x="40" y="275" width="420" height="185" rx="14" fill="rgba(18, 30, 22, 0.9)" stroke="rgba(16, 185, 129, 0.3)" />
  <text x="60" y="305" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Экспресс-оценка стоимости за 15 минут</text>
  <text x="60" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Прикрепите фото участка — инженер рассчитает точную смету</text>

  <!-- Dropzone Mock -->
  <rect x="60" y="340" width="380" height="60" rx="8" fill="rgba(7, 12, 9, 0.8)" stroke="rgba(16, 185, 129, 0.4)" stroke-dasharray="4 4" />
  <text x="250" y="368" font-family="system-ui, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">📷 Загрузить фотографии объекта</text>
  <text x="250" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">PNG, JPG до 25 МБ · Отправка сразу в Telegram инженеру</text>

  <!-- Submit Button -->
  <rect x="60" y="412" width="380" height="34" rx="8" fill="url(#zs-accent)" />
  <text x="250" y="434" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#042f1e" text-anchor="middle">Получить точный расчёт сметы →</text>

  <!-- Right Visual: Works Cards Mock -->
  <g transform="translate(480, 110)">
    <rect width="280" height="165" rx="12" fill="rgba(18, 30, 22, 0.8)" stroke="rgba(16, 185, 129, 0.2)" />
    <!-- Visual mockup before/after -->
    <rect x="15" y="15" width="120" height="95" rx="8" fill="#1f2937" />
    <text x="75" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">ДО: Аварийный дуб</text>
    <rect x="145" y="15" width="120" height="95" rx="8" fill="#064e3b" />
    <text x="205" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">ПОСЛЕ: Чистый газон</text>
    <text x="15" y="132" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Спил дуба 18м у забора</text>
    <text x="15" y="150" font-family="monospace, sans-serif" font-size="11" fill="#10b981">Срок: 4 часа · Без повреждения кровли</text>
  </g>

  <g transform="translate(480, 295)">
    <rect width="280" height="165" rx="12" fill="rgba(18, 30, 22, 0.8)" stroke="rgba(16, 185, 129, 0.2)" />
    <rect x="15" y="15" width="250" height="75" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.2)" />
    <text x="30" y="45" font-family="monospace, sans-serif" font-size="12" font-weight="bold" fill="#34d399">26 посадочных страниц</text>
    <text x="30" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Кластеризация под каждый район МО и вид работ</text>
    <text x="15" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Telegram Lead Delivery</text>
    <text x="15" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Доставка фото и геопозиции бригадиру в канал</text>
  </g>
</svg>

<svg width="1000" height="625" viewBox="0 0 1000 625" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18" />
      <stop offset="100%" stop-color="#05060b" />
    </linearGradient>
    <linearGradient id="gb-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="gb-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.18)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0)" />
    </radialGradient>
  </defs>

  <rect width="1000" height="625" fill="url(#gb-bg)" />
  <rect width="1000" height="625" fill="url(#gb-glow)" />

  <!-- Global grid lines -->
  <g stroke="rgba(99, 102, 241, 0.06)" stroke-width="1">
    <line x1="0" y1="90" x2="1000" y2="90" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="270" x2="1000" y2="270" />
    <line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="0" y1="540" x2="1000" y2="540" />
    <line x1="250" y1="0" x2="250" y2="625" />
    <line x1="500" y1="0" x2="500" y2="625" />
    <line x1="750" y1="0" x2="750" y2="625" />
  </g>

  <!-- Website Header -->
  <g transform="translate(50, 30)">
    <rect width="900" height="60" rx="12" fill="rgba(19, 22, 38, 0.85)" stroke="rgba(99, 102, 241, 0.25)" />
    <text x="30" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1.5">GLOBERION<tspan fill="#818cf8">GROUP</tspan></text>
    <text x="470" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Sourcing · Quality Control · Export Logistics · Categories · Trade Escort</text>
    <rect x="740" y="14" width="145" height="32" rx="8" fill="url(#gb-btn)" />
    <text x="812" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Request Quote</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(50, 120)">
    <rect width="290" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.35)" />
    <circle cx="16" cy="14" r="4" fill="#818cf8" />
    <text x="150" y="19" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">VIETNAM B2B SOURCING &amp; TRADE</text>
  </g>

  <text x="50" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Your Direct Gateway to</text>
  <text x="50" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#818cf8" letter-spacing="-0.5">Reliable Vietnam Manufacturing</text>
  <text x="50" y="280" font-family="system-ui, sans-serif" font-size="15" fill="#9ca3af">Factory audits, OEM/ODM production management &amp; sea freight from Cat Lai &amp; Hai Phong ports.</text>

  <!-- 3 Business Pillars Grid -->
  <g transform="translate(50, 315)">
    <!-- Pillar 1 -->
    <rect width="280" height="270" rx="14" fill="rgba(19, 22, 38, 0.9)" stroke="rgba(99, 102, 241, 0.25)" />
    <circle cx="35" cy="35" r="16" fill="rgba(99, 102, 241, 0.15)" />
    <text x="35" y="42" font-family="system-ui" font-size="18" fill="#818cf8" text-anchor="middle">🏭</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Factory Verification</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af">On-site technical and legal audits in Binh Duong, Dong Nai and Hai Phong industrial clusters.</text>
    <rect x="25" y="215" width="230" height="34" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" />
    <text x="140" y="237" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">ISO 9001 / BSCI Standards →</text>
  </g>

  <g transform="translate(360, 315)">
    <!-- Pillar 2 -->
    <rect width="280" height="270" rx="14" fill="rgba(19, 22, 38, 0.9)" stroke="rgba(99, 102, 241, 0.25)" />
    <circle cx="35" cy="35" r="16" fill="rgba(99, 102, 241, 0.15)" />
    <text x="35" y="42" font-family="system-ui" font-size="18" fill="#818cf8" text-anchor="middle">🔍</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Quality Assurance</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af">Pre-production checks, DUPRO, and pre-shipment container loading inspection (AQL 2.5 standards).</text>
    <rect x="25" y="215" width="230" height="34" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" />
    <text x="140" y="237" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">Full Photo / Video Reports →</text>
  </g>

  <g transform="translate(670, 315)">
    <!-- Pillar 3 -->
    <rect width="280" height="270" rx="14" fill="rgba(19, 22, 38, 0.9)" stroke="rgba(99, 102, 241, 0.25)" />
    <circle cx="35" cy="35" r="16" fill="rgba(99, 102, 241, 0.15)" />
    <text x="35" y="42" font-family="system-ui" font-size="18" fill="#818cf8" text-anchor="middle">🚢</text>
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Export &amp; Logistics</text>
    <text x="25" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af">FOB / CIF / DDP shipments from Cat Lai &amp; Hai Phong ports to Europe, North America &amp; CIS.</text>
    <rect x="25" y="215" width="230" height="34" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" />
    <text x="140" y="237" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">Customs Clearance Support →</text>
  </g>
</svg>

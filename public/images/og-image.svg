    <line x1="600" y1="260" x2="900" y2="180" />
    <line x1="600" y1="260" x2="600" y2="440" />
    <line x1="300" y1="180" x2="350" y2="380" />
    <line x1="900" y1="180" x2="850" y2="380" />
    <line x1="350" y1="380" x2="600" y2="440" />
    <line x1="850" y1="380" x2="600" y2="440" />
  </g>

  <!-- Node Circles -->
  <circle cx="300" cy="180" r="6" fill="#6366f1" />
  <circle cx="600" cy="260" r="10" fill="#818cf8" />
  <circle cx="900" cy="180" r="6" fill="#6366f1" />
  <circle cx="350" cy="380" r="6" fill="#6366f1" />
  <circle cx="850" cy="380" r="6" fill="#6366f1" />
  <circle cx="600" cy="440" r="8" fill="#6366f1" />

  <!-- Eyebrow Badge -->
  <rect x="420" y="140" width="360" height="38" rx="19" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" />
  <text x="600" y="164" font-family="monospace, sans-serif" font-size="13" font-weight="bold" fill="#818cf8" text-anchor="middle" letter-spacing="3">DIGITAL GROWTH SYSTEMS</text>

  <!-- Title -->
  <text x="600" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-2">VOLTRENA</text>
  <text x="600" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#a1a1aa" text-anchor="middle">Агентство цифровых систем и автоматизации</text>

  <!-- Tagline / Pipeline -->
  <text x="600" y="415" font-family="monospace, sans-serif" font-size="14" fill="#818cf8" text-anchor="middle" letter-spacing="2">СПРОС · САЙТ · ЗАЯВКА · CRM · АВТОМАТИЗАЦИЯ · АНАЛИТИКА</text>

  <!-- Footer Info -->

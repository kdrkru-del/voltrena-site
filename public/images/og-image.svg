      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#12121a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.22)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0)" />
    </radialGradient>
  </defs>

  <!-- Background -->

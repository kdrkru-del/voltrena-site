name: Temporary overflow diagnostics
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --prefix /tmp/voltrena-qa playwright@1.58.2
      - run: /tmp/voltrena-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: node .github/qa/overflow-debug.cjs
        env:
          NODE_PATH: /tmp/voltrena-qa/node_modules

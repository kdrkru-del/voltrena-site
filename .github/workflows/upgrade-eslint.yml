name: Upgrade ESLint to supported major

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/upgrade-eslint.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install supported ESLint and flat-config bridge
        run: npm install --save-dev eslint@^9 @eslint/eslintrc@^3

      - name: Add explicit Next.js flat ESLint config
        run: |
          cat > eslint.config.mjs <<'EOF'
          import { FlatCompat } from '@eslint/eslintrc';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const __filename = fileURLToPath(import.meta.url);
          const __dirname = path.dirname(__filename);
          const compat = new FlatCompat({ baseDirectory: __dirname });

          export default [
            ...compat.extends('next/core-web-vitals'),
            {
              ignores: ['.next/**', 'out/**', 'node_modules/**', 'qa-results/**'],
            },
          ];
          EOF

      - name: Verify production build
        run: npm run build

      - name: Verify ESLint directly
        run: npx eslint src --max-warnings=0

      - name: Commit only tested migration
        run: |
          rm .github/workflows/upgrade-eslint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.mjs .github/workflows/upgrade-eslint.yml
          git commit -m "chore: migrate linting to ESLint 9"
          git push origin master

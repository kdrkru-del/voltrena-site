name: Upgrade Next.js to supported LTS

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/upgrade-next15.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Migrate dynamic product params to async API
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/solutions/[slug]/page.tsx')
          text = path.read_text()
          old_meta = "export function generateMetadata({ params }: { params: { slug: string } }): Metadata {\n  const product = getDigitalProduct(params.slug);"
          new_meta = "export async function generateMetadata({ params }: { params: Promise<{ slug: string }> }): Promise<Metadata> {\n  const { slug } = await params;\n  const product = getDigitalProduct(slug);"
          old_page = "export default function DigitalProductPage({ params }: { params: { slug: string } }) {\n  const product = getDigitalProduct(params.slug);"
          new_page = "export default async function DigitalProductPage({ params }: { params: Promise<{ slug: string }> }) {\n  const { slug } = await params;\n  const product = getDigitalProduct(slug);"
          if old_meta not in text or old_page not in text:
              raise SystemExit('Expected Next 14 params signatures were not found')
          text = text.replace(old_meta, new_meta, 1).replace(old_page, new_page, 1)
          path.write_text(text)
          PY

      - name: Install supported Next.js and React versions
        run: |
          npm install --save-exact next@15.5.24 react@19.2.0 react-dom@19.2.0
          npm install --save-dev --save-exact eslint-config-next@15.5.24 @types/react@19 @types/react-dom@19

      - name: Fail only if critical vulnerabilities remain
        run: npm audit --audit-level=critical

      - name: Verify production build with default Next workers
        run: npm run build

      - name: Commit tested migration and regenerated lock
        run: |
          rm .github/workflows/upgrade-next15.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tsconfig.json 'src/app/solutions/[slug]/page.tsx' .github/workflows/upgrade-next15.yml
          git commit -m "chore: upgrade Next.js to 15.5.24 security LTS"
          git push origin master

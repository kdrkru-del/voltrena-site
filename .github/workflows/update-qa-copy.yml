name: Align QA with product CTA

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/update-qa-copy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Update expected form CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/qa/responsive.cjs')
          text = p.read_text()
          old = "name:'Обсудить задачу'"
          if text.count(old) != 2:
              raise SystemExit(f'Expected exactly 2 stale CTA assertions, found {text.count(old)}')
          p.write_text(text.replace(old, "name:'Получить конфигурацию'"))
          PY
      - name: Commit QA update
        run: |
          rm .github/workflows/update-qa-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/qa/responsive.cjs .github/workflows/update-qa-copy.yml
          git commit -m "test: align form QA with configuration CTA"
          git push origin master

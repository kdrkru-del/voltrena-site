name: Optimize portfolio media

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/optimize-media.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --disable-pip-version-check pillow==11.3.0

      - name: Resize and recompress large site images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          roots = [Path('public/images/projects'), Path('public/images/team')]
          changed = []
          for root in roots:
              for path in root.glob('*'):
                  if path.suffix.lower() not in {'.jpg', '.jpeg', '.webp'} or path.stat().st_size < 300_000:
                      continue
                  before = path.stat().st_size
                  with Image.open(path) as source:
                      image = ImageOps.exif_transpose(source).convert('RGB')
                      image.thumbnail((1440, 900), Image.Resampling.LANCZOS)
                      if path.suffix.lower() in {'.jpg', '.jpeg'}:
                          image.save(path, 'JPEG', quality=82, optimize=True, progressive=True)
                      else:
                          image.save(path, 'WEBP', quality=80, method=6)
                  after = path.stat().st_size
                  changed.append((str(path), before, after))

          for path, before, after in changed:
              print(f'{path}: {before/1024:.0f} KB -> {after/1024:.0f} KB')
          if not changed:
              raise SystemExit('No large media found to optimize')
          PY

      - name: Commit optimized binaries
        run: |
          rm .github/workflows/optimize-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images .github/workflows/optimize-media.yml
          git commit -m "perf: optimize portfolio media"
          git push origin master
